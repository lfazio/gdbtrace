[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdbtrace"
version = "0.1.0"
description = "GdbTrace : débogueur Cortex-M construit sur gdb (GDB/MI) avec une GUI tkinter"
requires-python = ">=3.10"
dependencies = ["pygdbmi>=0.11", "pyelftools>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
etm = ["capstone>=5.0"]          # trace d'instructions ETM (désassemblage Thumb-2)
dev = ["pytest>=7", "capstone>=5.0"]

[project.scripts]
gdbtrace = "gdbtrace.__main__:main"

[tool.setuptools.packages.find]
include = ["gdbtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
