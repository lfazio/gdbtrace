# Nucleo-F446RE (ST-Link V2-1 embarqué), Cortex-M4F, STM32F446RE (LQFP64 : pas de port de
# trace parallèle ; SWO sur PB3, relié à la sonde).
# Usage : python -m gdbtrace firmware.elf --openocd configs/nucleo-f446re.cfg \
#             --svd STM32F446.svd --cpu-hz 16000000
# Trace ETMv3.5 par SWO (couverture, Trace.List) : ajouter
#             --etm-config --etm-port swo --etm-stall
# (ou Trace › ETM par SWO… dans le GUI, cible arrêtée).
#
# Plusieurs sondes branchées : STLINK_SERIAL choisit la bonne (numéro de
# série USB, `probe-rs list` ou `lsusb -v`), sinon OpenOCD prend la première.
source [find interface/stlink.cfg]
transport select hla_swd
if { [info exists ::env(STLINK_SERIAL)] && $::env(STLINK_SERIAL) ne "" } {
    adapter serial $::env(STLINK_SERIAL)
}
source [find target/stm32f4x.cfg]
# Connexion sous reset par défaut (NRST relié à la sonde) ; CONNECT_UNDER_RESET=0 s'attache
# au cœur en marche sans le réinitialiser (--no-load).
if { [info exists ::env(CONNECT_UNDER_RESET)] && $::env(CONNECT_UNDER_RESET) eq "0" } {
    reset_config srst_only srst_nogate
} else {
    reset_config srst_only srst_nogate connect_assert_srst
}
