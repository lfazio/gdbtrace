# Nucleo-G070RB (ST-Link V2-1 embarqué), STM32G070RB : Cortex-M0+ à 16 MHz (HSI16 au reset).
# Usage : python -m gdbtrace firmware.elf --openocd configs/nucleo-g070rb.cfg \
#             --svd STM32G070.svd --cpu-hz 16000000
# Le M0+ n'a ni ITM, ni SWO, ni ETM (RM0444 §40) : pas de trace, mais le profil cible en
# marche lit DWT_PCSR (vue Profil, « Live »), et les vues se rafraîchissent en marche.
#
# Plusieurs sondes branchées : STLINK_SERIAL choisit la bonne (numéro de
# série USB, `probe-rs list` ou `lsusb -v`), sinon OpenOCD prend la première.
source [find interface/stlink.cfg]
transport select hla_swd
if { [info exists ::env(STLINK_SERIAL)] && $::env(STLINK_SERIAL) ne "" } {
    adapter serial $::env(STLINK_SERIAL)
}
source [find target/stm32g0x.cfg]
# Connexion sous reset par défaut : un firmware qui ne passe jamais en veille
# (WFI) peut faire échouer une connexion à chaud ; NRST est relié à la sonde.
# CONNECT_UNDER_RESET=0 s'attache au cœur en marche sans le réinitialiser
# (--no-load) : sous reset, le cœur est pris avant sa première instruction
# et il n'y a rien à déboguer (pc = 0).
if { [info exists ::env(CONNECT_UNDER_RESET)] && $::env(CONNECT_UNDER_RESET) eq "0" } {
    reset_config srst_only srst_nogate
} else {
    reset_config srst_only srst_nogate connect_assert_srst
    # Comme sur la Nucleo-F072RB (Cortex-M0) : un cœur ARMv6-M tenu sous reset peut ne pas
    # s'arrêter sur un simple halt, et l'attachement de gdb échoue. Reset et arrêt au vecteur
    # de reset à l'attachement.
    $_TARGETNAME configure -event gdb-attach { reset halt }
}
